<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="product2-title product2-desc">
  <title id="product2-title">Product Placeholder 2</title>
  <desc id="product2-desc">Clean product photo style placeholder - dress silhouette</desc>
  <defs>
    <linearGradient id="productGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F5EDE3;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#EDE4D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5DCCF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="productShadow2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="60%" style="stop-color:#000000;stop-opacity:0.02" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.08" />
    </linearGradient>
    <pattern id="fabricTexture2" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q10 0 20 10 Q10 20 0 10" fill="none" stroke="#D4C4B0" stroke-width="0.2" opacity="0.08"/>
    </pattern>
  </defs>
  
  <rect width="800" height="1000" fill="url(#productGradient2)"/>
  <rect width="800" height="1000" fill="url(#fabricTexture2)"/>
  
  <g transform="translate(400, 500)">
    <ellipse cx="0" cy="380" rx="260" ry="35" fill="url(#productShadow2)"/>
    
    <!-- Dress silhouette -->
    <g fill="#F5EDE3" stroke="#D4C4B0" stroke-width="1.5" opacity="0.9">
      <path d="M -140 -220 Q -140 -290 -70 -290 L 70 -290 Q 140 -290 140 -220 Q 160 -180 160 -80 L 160 300 Q 160 350 110 350 L -110 350 Q -160 350 -160 300 L -160 -80 Q -140 -180 -140 -220 Z"/>
      
      <!-- Waist definition -->
      <path d="M -120 -40 Q -120 -60 -80 -60 Q -40 -60 -40 -40" fill="none" stroke="#D4C4B0" stroke-width="1" opacity="0.4"/>
      <path d="M 40 -40 Q 40 -60 80 -60 Q 120 -60 120 -40" fill="none" stroke="#D4C4B0" stroke-width="1" opacity="0.4"/>
      
      <!-- Straps -->
      <path d="M -80 -220 Q -80 -250 -50 -250 Q -20 -250 -20 -220" fill="none" stroke="#D4C4B0" stroke-width="3" stroke-linecap="round"/>
      <path d="M 20 -220 Q 20 -250 50 -250 Q 80 -250 80 -220" fill="none" stroke="#D4C4B0" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <g stroke="#D4C4B0" stroke-width="0.5" opacity="0.15" fill="none">
      <path d="M -100 -200 Q -100 -50 -100 100"/>
      <path d="M 0 -200 Q 0 -50 0 100"/>
      <path d="M 100 -200 Q 100 -50 100 100"/>
    </g>
  </g>
  
  <g transform="translate(400, 920)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="300" fill="#A89480" letter-spacing="0.1em">PRODUCT PLACEHOLDER</text>
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#C4B4A0">800 × 1000 • Dress Silhouette</text>
    <text x="0" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#D4C4B0" opacity="0.7">Moda Feminina • Premium Placeholder</text>
  </g>
  
  <g stroke="#D4C4B0" stroke-width="1" opacity="0.15" fill="none">
    <path d="M 50 50 L 50 150 M 50 50 L 150 50"/>
    <path d="M 750 50 L 750 150 M 750 50 L 650 50"/>
    <path d="M 50 950 L 50 850 M 50 950 L 150 950"/>
    <path d="M 750 950 L 750 850 M 750 950 L 650 950"/>
  </g>
</svg>