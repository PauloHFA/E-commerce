<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collection-dresses-title collection-dresses-desc">
  <title id="collection-dresses-title">Vestidos Collection Thumbnail</title>
  <desc id="collection-dresses-desc">Circular collection thumbnail for Vestidos category - dresses from casual to party</desc>
  <defs>
    <linearGradient id="dressesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5EDE3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE4D9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="dressesGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FDF8F3;stop-opacity:0" />
    </radialGradient>
    <pattern id="silkTexture" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q6 0 12 6 Q6 12 0 6" fill="none" stroke="#D4C4B0" stroke-width="0.25" opacity="0.12"/>
    </pattern>
  </defs>
  
  <clipPath id="circleClip">
    <circle cx="300" cy="300" r="295"/>
  </clipPath>
  
  <g clip-path="url(#circleClip)">
    <circle cx="300" cy="300" r="300" fill="url(#dressesGradient)"/>
    <circle cx="300" cy="300" r="300" fill="url(#silkTexture)"/>
    <circle cx="300" cy="300" r="300" fill="url(#dressesGlow)"/>
    <circle cx="300" cy="300" r="270" fill="none" stroke="#D4C4B0" stroke-width="1" opacity="0.2"/>
    <circle cx="300" cy="300" r="240" fill="none" stroke="#D4C4B0" stroke-width="0.5" opacity="0.1"/>
  </g>
  
  <g transform="translate(300, 300)">
    <!-- Category icon - minimalist dress silhouette -->
    <g stroke="#A89480" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <path d="M -35 -30 Q -35 -50 0 -50 Q 35 -50 35 -30 L 45 50 L -45 50 Z"/>
      <path d="M -20 -30 Q -20 -40 0 -40 Q 20 -40 20 -30"/>
      <ellipse cx="0" cy="10" rx="25" ry="15" fill="none" stroke="#A89480" stroke-width="1.5" opacity="0.4"/>
    </g>
    
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="300" fill="#A89480" letter-spacing="0.08em">VESTIDOS</text>
    <text x="0" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#C4B4A0" letter-spacing="0.1em">DO CASUAL AO FESTA</text>
    <text x="0" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#D4C4B0" opacity="0.7">600 × 600 • Circular</text>
  </g>
  
  <circle cx="300" cy="300" r="298" fill="none" stroke="#D4C4B0" stroke-width="2" opacity="0.15"/>
</svg>