<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collection-accessories-title collection-accessories-desc">
  <title id="collection-accessories-title">Acessórios Collection Thumbnail</title>
  <desc id="collection-accessories-desc">Circular collection thumbnail for Acessórios category - the finishing touch</desc>
  <defs>
    <linearGradient id="accessoriesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF6F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F2EDE4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EAE4D9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="accessoriesGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FAF6F1;stop-opacity:0" />
    </radialGradient>
    <pattern id="leatherTexture" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0 L16 16 M16 0 L0 16" stroke="#C8B8A8" stroke-width="0.2" opacity="0.08"/>
      <circle cx="8" cy="8" r="2" fill="#C8B8A8" opacity="0.06"/>
    </pattern>
  </defs>
  
  <clipPath id="circleClip">
    <circle cx="300" cy="300" r="295"/>
  </clipPath>
  
  <g clip-path="url(#circleClip)">
    <circle cx="300" cy="300" r="300" fill="url(#accessoriesGradient)"/>
    <circle cx="300" cy="300" r="300" fill="url(#leatherTexture)"/>
    <circle cx="300" cy="300" r="300" fill="url(#accessoriesGlow)"/>
    <circle cx="300" cy="300" r="270" fill="none" stroke="#C8B8A8" stroke-width="1" opacity="0.2"/>
    <circle cx="300" cy="300" r="240" fill="none" stroke="#C8B8A8" stroke-width="0.5" opacity="0.1"/>
  </g>
  
  <g transform="translate(300, 300)">
    <!-- Category icon - minimalist accessories (bag, jewelry, scarf) -->
    <g stroke="#A89888" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <!-- Handbag -->
      <path d="M -45 -10 L -45 -35 Q -45 -45 -35 -45 L 5 -45 Q 15 -45 15 -35 L 15 -10 Z"/>
      <path d="M -30 -35 L -30 -50 M 0 -35 L 0 -50"/>
      <path d="M -35 -20 Q -25 -20 -25 -10"/>
      <!-- Necklace -->
      <ellipse cx="35" cy="15" rx="18" ry="12" fill="none"/>
      <circle cx="35" cy="15" r="4" fill="#A89888" opacity="0.4"/>
      <!-- Earring -->
      <circle cx="-5" cy="40" r="6" fill="none"/>
      <circle cx="-5" cy="40" r="3" fill="#A89888" opacity="0.5"/>
    </g>
    
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="300" fill="#A89888" letter-spacing="0.08em">ACESSÓRIOS</text>
    <text x="0" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#C4B4A4" letter-spacing="0.1em">O TOQUE FINAL</text>
    <text x="0" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#C8B8A8" opacity="0.7">600 × 600 • Circular</text>
  </g>
  
  <circle cx="300" cy="300" r="298" fill="none" stroke="#C8B8A8" stroke-width="2" opacity="0.15"/>
</svg>