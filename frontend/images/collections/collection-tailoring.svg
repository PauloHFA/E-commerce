<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collection-tailoring-title collection-tailoring-desc">
  <title id="collection-tailoring-title">Alfaiataria Collection Thumbnail</title>
  <desc id="collection-tailoring-desc">Circular collection thumbnail for Alfaiataria category - structured elegance</desc>
  <defs>
    <linearGradient id="tailoringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0EFEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E6E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0DDD5;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="tailoringGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#F0EFEB;stop-opacity:0" />
    </radialGradient>
    <pattern id="woolTexture" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#B8B0A0" opacity="0.1"/>
      <circle cx="2" cy="8" r="1" fill="#B8B0A0" opacity="0.08"/>
      <circle cx="8" cy="2" r="1" fill="#B8B0A0" opacity="0.08"/>
    </pattern>
  </defs>
  
  <clipPath id="circleClip">
    <circle cx="300" cy="300" r="295"/>
  </clipPath>
  
  <g clip-path="url(#circleClip)">
    <circle cx="300" cy="300" r="300" fill="url(#tailoringGradient)"/>
    <circle cx="300" cy="300" r="300" fill="url(#woolTexture)"/>
    <circle cx="300" cy="300" r="300" fill="url(#tailoringGlow)"/>
    <circle cx="300" cy="300" r="270" fill="none" stroke="#B8B0A0" stroke-width="1" opacity="0.2"/>
    <circle cx="300" cy="300" r="240" fill="none" stroke="#B8B0A0" stroke-width="0.5" opacity="0.1"/>
  </g>
  
  <g transform="translate(300, 300)">
    <!-- Category icon - minimalist blazer/jacket silhouette -->
    <g stroke="#8B8378" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <path d="M -40 -25 L -40 -45 Q -40 -55 -30 -55 L 30 -55 Q 40 -55 40 -45 L 40 -25"/>
      <path d="M -40 -25 L -50 40 L 50 40 L 40 -25"/>
      <path d="M -15 -45 L -15 -10 M 15 -45 L 15 -10"/>
      <path d="M -25 10 L -25 40 M 25 10 L 25 40"/>
    </g>
    
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="300" fill="#8B8378" letter-spacing="0.08em">ALFAIATARIA</text>
    <text x="0" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#A8A095" letter-spacing="0.1em">ESTRUTURA E ELEGÂNCIA</text>
    <text x="0" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#B8B0A0" opacity="0.7">600 × 600 • Circular</text>
  </g>
  
  <circle cx="300" cy="300" r="298" fill="none" stroke="#B8B0A0" stroke-width="2" opacity="0.15"/>
</svg>